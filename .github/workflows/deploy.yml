name: Build and Deploy to EKS

on:
  push:
    branches:
      - main

env:
  ECR_REGISTRY: 307187891149.dkr.ecr.ca-central-1.amazonaws.com
  ECR_REPOSITORY: capstone-python-app
  EKS_CLUSTER: adorable-lofi-mongoose
  AWS_REGION: ca-central-1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build and push Docker image
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA .
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA \
                   $ECR_REGISTRY/$ECR_REPOSITORY:latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig \
          --region $AWS_REGION \
          --name $EKS_CLUSTER

    - name: Deploy to EKS
      run: |
        kubectl apply -f deployment.yaml
        kubectl set image deployment/capstone-python-app \
          capstone-python-app=$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA
        kubectl rollout status deployment/capstone-python-app