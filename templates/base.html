<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Student Grade Management{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; }

        .sidebar {
            min-height: 100vh;
            background: linear-gradient(180deg, #1a1f36 0%, #2d3561 100%);
            width: 240px;
            position: fixed;
            top: 0; left: 0;
            padding-top: 1.5rem;
            z-index: 100;
        }
        .sidebar .brand {
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 0 1.25rem 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,0.65);
            padding: 0.6rem 1.25rem;
            border-radius: 0.5rem;
            margin: 0.15rem 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            color: #fff;
            background: rgba(255,255,255,0.12);
        }
        .sidebar .nav-section {
            color: rgba(255,255,255,0.35);
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 1rem 1.25rem 0.4rem;
        }

        .main-content {
            margin-left: 240px;
            padding: 2rem;
        }
        .topbar {
            background: #fff;
            border-radius: 0.75rem;
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        .topbar h4 { margin: 0; font-weight: 700; color: #1a1f36; font-size: 1.1rem; }
        .topbar .subtitle { color: #8898aa; font-size: 0.85rem; margin: 0; }

        .card {
            border: none;
            border-radius: 0.75rem;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
        }
        .stat-card {
            border-radius: 0.75rem;
            padding: 1.25rem 1.5rem;
            color: #fff;
            position: relative;
            overflow: hidden;
        }
        .stat-card .icon {
            font-size: 2.5rem;
            opacity: 0.2;
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
        }
        .stat-card .label { font-size: 0.8rem; opacity: 0.85; font-weight: 500; }
        .stat-card .value { font-size: 2rem; font-weight: 700; line-height: 1.2; }

        .bg-grad-blue  { background: linear-gradient(135deg, #4e73df, #224abe); }
        .bg-grad-green { background: linear-gradient(135deg, #1cc88a, #13855c); }
        .bg-grad-orange{ background: linear-gradient(135deg, #f6c23e, #dda20a); }
        .bg-grad-red   { background: linear-gradient(135deg, #e74a3b, #be2617); }

        .search-card { background: #fff; border-radius: 0.75rem; padding: 1.5rem; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
        .table thead th { background: #f8f9fc; color: #525f7f; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; border-bottom: 2px solid #e3e6f0; }
        .table td { vertical-align: middle; font-size: 0.875rem; color: #525f7f; }
        .badge-level { font-size: 0.75rem; padding: 0.35em 0.7em; border-radius: 0.4rem; }
        .result-section { display: none; }
        .result-section.show { display: block; }
        .empty-state { text-align: center; padding: 3rem; color: #adb5bd; }
        .empty-state i { font-size: 3rem; display: block; margin-bottom: 1rem; }
    </style>
</head>
<body>

<!-- Sidebar -->
<nav class="sidebar">
    <div class="brand">
        <i class="bi bi-mortarboard-fill"></i>
        Grade Manager
    </div>
    <div class="mt-3">
        <div class="nav-section">Main</div>
        <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">
            <i class="bi bi-speedometer2"></i> Dashboard
        </a>
        <div class="nav-section">Academic</div>
        <a href="/students" class="nav-link {% if request.path == '/students' %}active{% endif %}">
            <i class="bi bi-people"></i> Students by Course
        </a>
        <a href="/grades" class="nav-link {% if request.path == '/grades' %}active{% endif %}">
            <i class="bi bi-bar-chart-line"></i> Grades by Student
        </a>
    </div>
</nav>

<!-- Main Content -->
<div class="main-content">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
